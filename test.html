<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        body {
            background-color: rgb(34, 33, 33);;

        /* #gridSizeButton {

        #container {
            width: 600px;
            height: 600px;

        }
        
    </style>
</head>
<body>
    <!-- <button id="gridSizeButton">Change grid size?</button> -->
    <div id='container'></div>

    <script>

        let gridSize = 0;
        let containerJS = document.getElementById('container');

        //  //button changes grid size
        // let gridSizeChanger = document.getElementById('gridSizeButton');
        // gridSizeChanger.addEventListener('click', function(){
        //     let newGridSize = prompt('What would you like the new grid size to be? (add no. of squares needed in one line)');
        //     gridSize = Number(newGridSize.textcontent);
        // })
        

        //creating 256 divs inside the container
        
        
        for (; gridSize<10; gridSize++) {
            let newDiv = document.createElement('div');
            newDiv.style.flex = 1;
            
            newDiv.style.backgroundColor = 'black';
            newDiv.style.border = '1px dashed RGB(160,160,255)'
            containerJS.appendChild(newDiv);

            //adding hover effect on the grid
            newDiv.addEventListener('mouseenter', function(){
                newDiv.style.backgroundColor = 'gray';
            })  
        }
    </script>
</body>
