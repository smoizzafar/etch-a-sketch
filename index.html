<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(20, 20, 20);
        }

        #container {
            display: flex;
            border: 2px solid red;
            width: 750px;
            height: 750px;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <button id="button">change no of boxes</button>

    <script>
        let containerJS = document.getElementById("container");
        let noOfDivs = 16;
        let changeButton = document.getElementById("button");

        for (let i = 0; i<noOfDivs; i++) {
            let newDiv = document.createElement('div');
            containerJS.appendChild(newDiv);
            newDiv.style.border = '1px solid blue';
            newDiv.style.flex = '1';
            newDiv.style.display = 'flex';

            for (let n = 0; n<noOfDivs; n++) {
                let rowBlock = document.createElement('div');
                newDiv.appendChild(rowBlock);
                rowBlock.style.border = '1px solid green';
                rowBlock.style.flex = '1';
                
                //adding hover effect on the grid
                rowBlock.addEventListener('mouseenter', function(){
                    rowBlock.style.backgroundColor = 'gray';
                }) 
            }
        }

        changeButton.addEventListener('click', function(){
            containerJS.innerHTML = '';
            
            noOfDivs = Number(prompt('add new number?'));
            while (noOfDivs < 1 || noOfDivs > 100 || Number.isNaN(noOfDivs)) {
                noOfDivs = Number(prompt('Please enter a number between 1-100: '))
            }
            
            for (let i = 0; i<noOfDivs; i++) {
            let newDiv = document.createElement('div');
            containerJS.appendChild(newDiv);
            newDiv.style.border = '1px solid blue';
            newDiv.style.flex = '1';
            newDiv.style.display = 'flex';

            for (let n = 0; n<noOfDivs; n++) {
                let rowBlock = document.createElement('div');
                newDiv.appendChild(rowBlock);
                rowBlock.style.border = '1px solid green';
                rowBlock.style.flex = '1';
                
                //adding hover effect on the grid
                rowBlock.addEventListener('mouseenter', function(){
                    rowBlock.style.backgroundColor = 'gray';
                }) 
            }
        }
        })
        
       
        
    </script>
    
</body>
</html>
